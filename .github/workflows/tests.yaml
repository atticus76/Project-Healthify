name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: healthify-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthify_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthify_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches your Dockerfile
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: pip install -r code/requirements.txt

      - name: Run tests
        run: pytest -rs # -rs prints the reason for every skipped test

  publish:
    name: Build and publish Docker image
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and tag image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" .
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push both image tags to Docker Hub
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Request Render deployment
    needs: publish
    if: vars.DEPLOY_TO_RENDER == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy the published commit tag
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --output /dev/null --request POST \
            --url-query "imgURL=docker.io/$IMAGE:$GITHUB_SHA" "$HOOK"
